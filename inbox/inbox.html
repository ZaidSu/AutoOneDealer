<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inbox | Auto One Email System</title>
  <link rel="stylesheet" href="inbox.css" />
</head>
<body>
<div class="app">

<aside class="sidebar">
  <div class="logo">A1</div>
  <div class="dealer-name">Auto One<br><span>Email System</span></div>

  <nav>
    <a href="../dashboard/dashboard.html" class="">Dashboard</a>
    <a href="../inbox/inbox.html" class="active">Inbox</a>
    <a href="../analytics/analytics.html" class="">Analytics</a>
    <a href="../settings/settings.html" class="">Settings</a>
  </nav>

  <a class="logout" href="../index.html">Log Out</a>
</aside>

<main class="main">
  <header class="topbar">
    <div>
      <h1>Inbox</h1>
      <p>Only approved dealership leads from your Gmail inbox.</p>
    </div>
    <span class="badge" id="connectionBadge">Checking Gmail...</span>
  </header>

  <div id="inboxNotice" class="notice">Checking Gmail connection... <a href="../settings/settings.html">Settings</a></div>
  <div class="toolbar card">
    <input id="searchInput" type="search" placeholder="Search emails..." />
    <select id="statusFilter">
      <option value="all">All leads</option>
      <option value="unread">Unread</option>
      <option value="read">Read</option>
    </select>
    <select id="sourceFilter" aria-label="Lead source">
      <option value="all">All lead sources</option>
      <option value="Cars.com">Cars.com</option>
      <option value="CarZing">CarZing</option>
      <option value="Credit Union of Texas">Credit Union of Texas</option>
      <option value="Other lead">Other leads</option>
    </select>
    <button type="button" id="refreshInbox">Refresh</button>
  </div>

  <section class="inbox-layout">
    <div class="card list"><div id="emailList" class="email-list"></div><button type="button" id="loadMore" class="load-more hidden">Load more emails</button></div>

    <article class="card reader">
      <div id="emptyState" class="empty">Select an email to open it.</div>
      <div id="emailView" class="hidden">
        <div class="reader-head">
          <div>
            <h2 id="emailSubject"></h2>
            <p id="emailMeta"></p>
          </div>
          <span id="emailStatus" class="status-pill"></span>
        </div>

        <div id="emailBody" class="email-body"></div>

        <div class="ai-box">
          <div class="ai-title">
            <strong>AI Replies — coming next</strong>
            <button id="generateReply" disabled title="Read-only testing version">Generate Reply</button>
          </div>
          <textarea id="replyText" disabled placeholder="This version reads Gmail only. AI replies will be added next."></textarea>
          <div class="reply-actions">
            <button class="secondary" id="saveDraft" disabled>Save Draft</button>
            <button id="sendReply" disabled>Send Reply</button>
          </div>
        </div>
      </div>
    </article>
  </section>
</main>
</div>
<script src="../auth-logout.js"></script>
<script src="inbox.js"></script>
</body>
</html>
