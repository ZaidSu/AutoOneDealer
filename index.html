<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto One Email System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="brand-mark">A1</div>
      <p class="eyebrow">AUTO ONE MOTORS</p>
      <h1>Dealer Login</h1>
      <p class="subtext">Manage customer emails, AI replies, and follow-ups from one place.</p>

      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter username" />

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" />

        <button type="submit">Login</button>
      </form>

      <p class="demo-note">Testing mode: any username/password will work.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
